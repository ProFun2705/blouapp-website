name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production site
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null https://tryblou.com/; then
              echo "tryblou.com is reachable"
              exit 0
            fi
            echo "Waiting for production (${i}/24)..."
            sleep 10
          done
          echo "Timed out waiting for https://tryblou.com/" >&2
          exit 1

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
        run: |
          if [ -z "$INDEXNOW_SECRET" ]; then
            echo "Set the INDEXNOW_SECRET GitHub Actions secret to the same value as INDEXNOW_SECRET (or INDEXNOW_KEY) on Vercel." >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "x-indexnow-secret: ${INDEXNOW_SECRET}" \
            -H "Content-Type: application/json" \
            https://tryblou.com/api/indexnow
